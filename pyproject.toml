[project]
name = "omw"
version = "0.0.2"
description = "Open Maya Wrapper: An egornomic and typed Python API for Maya"
readme = "README.md"
authors = [
    { name = "Michael Harmon", email = "michaelharmonart@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "maya-stubs>=0.4.2",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
debug = [ "debugpy>=1.8.19" ]

[[dependency-groups.dev]]
include-group = "lint"

[[dependency-groups.dev]]
include-group = "debug"

[tool.ruff]
line-length = 100


[tool.ruff.lint]
preview = true
extend-select = [
"ANN",
"B",
"E",
"FA",
"I",
"INP",
"N",
"PTH",
"SIM",
"T20",
"TID",
"UP",
"F",
"RUF"
]

ignore = ["line-too-long"]
