[project]
name = "omw"
version = "0.0.1"
description = "Open Maya Wrapper: An egornomic and typed Python API for Maya"
readme = "README.md"
authors = [
    { name = "Michael Harmon", email = "michaelharmonart@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "maya-stubs>=0.4.2",
]
